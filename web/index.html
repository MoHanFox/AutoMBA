<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoMBA · MBA 化简器</title>
<style>
  :root {
    --bg: #080b11;
    --bg-soft: #0b1018;
    --panel: #0d131d;
    --panel-2: #101823;
    --border: #1b2737;
    --border-soft: #16202d;
    --text: #d8e3f0;
    --muted: #73849a;
    --faint: #405168;
    --accent: #54d6c5;
    --accent-2: #f0b35f;
    --red: #ff6f7d;
    --green: #54d68a;
    --blue: #64b5ff;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "JetBrains Mono", "Fira Code", monospace;
    --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --split: 50%;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(84, 214, 197, .07), transparent 60%),
      radial-gradient(900px 420px at 95% 0%, rgba(100, 181, 255, .05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: rgba(84, 214, 197, .26); color: #fff; }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: 64px 56px minmax(0, 1fr) 34px;
    min-width: 0;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 22px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(15, 22, 33, .94), rgba(10, 15, 23, .82));
    backdrop-filter: blur(14px);
    user-select: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 36px; height: 36px;
    border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #173b3a, #0f2228);
    border: 1px solid rgba(84, 214, 197, .32);
    box-shadow: 0 0 22px rgba(84, 214, 197, .14), inset 0 1px 0 rgba(255,255,255,.06);
    color: var(--accent);
    font: 700 18px/1 var(--mono);
    letter-spacing: -1px;
  }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: .2px;
  }
  .brand .sub {
    margin-top: 3px;
    color: var(--muted);
    font-size: 9.5px;
    letter-spacing: 2.1px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .top-right { display: flex; align-items: center; gap: 16px; }
  .width-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .segmented {
    display: inline-flex;
    align-items: center;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--border);
    background: #0a1018;
    border-radius: 10px;
  }
  .segmented button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 11.5px/1 var(--mono);
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .segmented button:hover { color: var(--text); background: #141e2b; }
  .segmented button.active {
    color: #04110f;
    background: linear-gradient(135deg, #45c9ba, #74e0d0);
    box-shadow: 0 2px 10px rgba(84, 214, 197, .2);
  }
  .engine {
    display: flex; align-items: center; gap: 7px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: .8px;
    text-transform: uppercase;
  }
  .engine i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(84, 214, 138, .75);
  }

  /* ---------- action bar ---------- */
  .actionbar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 22px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(9, 14, 21, .55);
    user-select: none;
  }
  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 13px;
    border-radius: 8px;
    border: 1px solid #263445;
    background: #121a25;
    color: #c7d4e3;
    font: 500 12px/1 var(--ui);
    cursor: pointer;
    transition: transform .12s, border-color .15s, background .15s, color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #172231; border-color: #34465c; color: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .38; cursor: default; transform: none; }
  .btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .btn.primary {
    border-color: #42bcae;
    background: linear-gradient(135deg, #3cc4b4, #68ded0);
    color: #03110f;
    font-weight: 650;
    box-shadow: 0 3px 16px rgba(84, 214, 197, .16), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn.primary:hover { background: linear-gradient(135deg, #4bd4c3, #7ce8da); border-color: #5cd6c8; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: rgba(255,255,255,.04); border-color: var(--border); color: var(--text); }
  .btn kbd {
    margin-left: 2px;
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,.22);
    background: rgba(0,0,0,.13);
    font: 500 9px/1 var(--mono);
    color: rgba(3,17,15,.65);
  }
  .spacer { flex: 1; }
  .hint {
    color: var(--faint);
    font-size: 10.5px;
    letter-spacing: .2px;
    margin-right: 3px;
  }

  /* ---------- workspace ---------- */
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, var(--split)) 8px minmax(0, 1fr);
    min-height: 0;
    padding: 12px 14px 10px;
    gap: 0;
  }
  .panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(15, 22, 33, .92), rgba(11, 16, 25, .94));
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025);
  }
  .input-panel { border-top-left-radius: 12px; }
  .output-panel { border-top-right-radius: 12px; }
  .panel-head {
    height: 38px;
    flex: 0 0 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 13px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(255,255,255,.012);
    user-select: none;
  }
  .panel-title {
    display: flex; align-items: center; gap: 8px;
    color: #aebdd0;
    font-size: 11.5px;
    font-weight: 550;
    letter-spacing: .2px;
  }
  .badge {
    font: 700 8.5px/1 var(--mono);
    letter-spacing: 1px;
    padding: 4px 5px;
    border-radius: 4px;
    border: 1px solid rgba(84, 214, 197, .22);
    background: rgba(84, 214, 197, .08);
    color: var(--accent);
  }
  .badge.out {
    border-color: rgba(240, 179, 95, .22);
    background: rgba(240, 179, 95, .08);
    color: var(--accent-2);
  }
  .panel-meta {
    color: var(--faint);
    font: 500 10px/1 var(--mono);
    letter-spacing: .4px;
  }
  .editor {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }
  .gutter {
    flex: 0 0 48px;
    padding: 15px 9px 15px 0;
    text-align: right;
    color: #3c4d63;
    font: 12.5px/1.62 var(--mono);
    white-space: pre;
    overflow: hidden;
    user-select: none;
    border-right: 1px solid rgba(27, 39, 55, .55);
    background: rgba(0,0,0,.08);
  }
  textarea {
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    padding: 15px 18px;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: #d5e0ed;
    caret-color: var(--accent);
    font: 12.5px/1.62 var(--mono);
    tab-size: 4;
    white-space: pre;
    overflow: auto;
    scrollbar-color: #2a3a4e transparent;
    scrollbar-width: thin;
  }
  textarea::placeholder { color: #3c4d63; opacity: 1; }
  #output { color: #cfe4e0; }
  #output::placeholder { color: #3c4d63; }
  textarea::-webkit-scrollbar { width: 11px; height: 11px; }
  textarea::-webkit-scrollbar-thumb {
    background: #263547;
    border: 3px solid transparent;
    background-clip: padding-box;
    border-radius: 8px;
  }
  textarea::-webkit-scrollbar-thumb:hover { background: #334961; background-clip: padding-box; border: 3px solid transparent; }
  textarea::-webkit-scrollbar-corner { background: transparent; }

  .splitter {
    cursor: col-resize;
    display: grid;
    place-items: center;
    user-select: none;
  }
  .splitter span {
    width: 2px;
    height: 46px;
    border-radius: 2px;
    background: #223044;
    transition: background .15s, box-shadow .15s;
  }
  .splitter:hover span { background: var(--accent); box-shadow: 0 0 8px rgba(84,214,197,.5); }

  /* ---------- footer ---------- */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 22px;
    border-top: 1px solid var(--border-soft);
    background: rgba(7, 11, 17, .76);
    color: var(--muted);
    font-size: 10.5px;
    user-select: none;
  }
  .status { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 7px rgba(84,214,138,.65);
    flex: 0 0 auto;
  }
  .status.busy .led { background: var(--accent-2); box-shadow: 0 0 9px rgba(240,179,95,.7); animation: pulse 1s ease-in-out infinite; }
  .status.error .led { background: var(--red); box-shadow: 0 0 9px rgba(255,111,125,.75); }
  .status .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; align-items: center; gap: 7px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 20px;
    padding: 0 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: rgba(255,255,255,.018);
    color: var(--faint);
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .2px;
    white-space: nowrap;
  }
  .chip b { color: #9fb1c5; font-weight: 600; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 52px;
    transform: translate(-50%, 8px);
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid #2b3b4e;
    background: #121b26;
    color: #dbe7f3;
    font-size: 11.5px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1180px) {
    .engine { display: none; }
    .hint { display: none; }
    .top-right { gap: 10px; }
    .actionbar { gap: 6px; }
  }
  @media (max-width: 980px) {
    .brand .sub { display: none; }
    .width-label { display: none; }
    .btn { padding: 0 10px; }
    .btn kbd { display: none; }
    .btn.ghost { padding: 0 8px; }
  }
  @media (max-width: 900px) {
    .app { grid-template-rows: 58px 54px minmax(0, 1fr) 34px; }
    .workspace {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 8px minmax(0, 1fr);
      padding: 9px;
    }
    .splitter { cursor: row-resize; }
    .splitter span { width: 46px; height: 2px; }
    .engine, .hint, .brand .sub { display: none; }
    .topbar, .actionbar { padding-left: 12px; padding-right: 12px; }
    .footer { padding: 0 12px; }
    .stats .chip.optional { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>AutoMBA</h1>
        <div class="sub">Mixed Boolean-Arithmetic Simplifier</div>
      </div>
    </div>
    <div class="top-right">
      <div class="engine"><i></i> WebView · Local</div>
      <span class="width-label">位宽</span>
      <div class="segmented" id="widthGroup" role="group" aria-label="位宽">
        <button type="button" data-width="8">8</button>
        <button type="button" data-width="16">16</button>
        <button type="button" data-width="32" class="active">32</button>
        <button type="button" data-width="64">64</button>
      </div>
    </div>
  </header>

  <div class="actionbar">
    <button class="btn primary" id="btnSimplify" title="解析输入并化简 MBA">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l1-8Z"/></svg>
      简化 <kbd>Ctrl↵</kbd>
    </button>
    <button class="btn" id="btnDeep" disabled title="以当前结果为输入，传播已知定义后再化简">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      以结果再简化
    </button>
    <button class="btn" id="btnCopy" disabled title="复制右侧结果">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      复制结果
    </button>
    <div class="spacer"></div>
    <span class="hint">支持赋值 / += / return / 表达式片段</span>
    <button class="btn ghost" id="btnSample">载入示例</button>
    <button class="btn ghost" id="btnClear">清空</button>
  </div>

  <main class="workspace" id="workspace">
    <section class="panel input-panel">
      <div class="panel-head">
        <div class="panel-title"><span class="badge">IN</span> C / MBA 输入</div>
        <div class="panel-meta" id="inputMeta">0 行</div>
      </div>
      <div class="editor">
        <div class="gutter" id="inputGutter">1</div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" wrap="off" aria-label="C 代码输入" placeholder="在这里粘贴 C 代码或 MBA 表达式…&#10;&#10;v6 = ~(~(v5 &amp; 0x63E364E2 ^ ~v5 &amp; 0x9C1C9B1D ^ 0xE5CC39DD) | …);&#10;*a1 += v18 &amp; (…);"></textarea>
      </div>
    </section>

    <div class="splitter" id="splitter" title="拖动调整比例"><span></span></div>

    <section class="panel output-panel">
      <div class="panel-head">
        <div class="panel-title"><span class="badge out">OUT</span> 化简结果 <span style="color:var(--faint);font-weight:400;font-size:10px">只读 · 可复制</span></div>
        <div class="panel-meta" id="outputMeta">0 行</div>
      </div>
      <div class="editor">
        <div class="gutter" id="outputGutter">1</div>
        <textarea id="output" readonly spellcheck="false" wrap="off" aria-label="化简结果" placeholder="结果会显示在这里…"></textarea>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="status" id="status"><span class="led"></span><span class="txt">就绪 · 粘贴代码后按 Ctrl+Enter</span></div>
    <div class="stats">
      <span class="chip optional">语句 <b id="statStmts">0</b></span>
      <span class="chip optional">改写 <b id="statChanged">0</b></span>
      <span class="chip optional">轮次 <b id="statPasses">0</b></span>
      <span class="chip">缩减 <b id="statReduction">—</b></span>
      <span class="chip">位宽 <b id="statWidth">32</b></span>
      <span class="chip">耗时 <b id="statTime">—</b></span>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const SAMPLE = `    v18 = sub_140006120((unsigned int)*a2);
    v17 = *a3;
    v4 = sub_140006140(*a3, (unsigned int)i);
    *a1 += v18
         & ((((*(_DWORD *)&aYcsvllo3xM9zAa[4 * v4] + v17) ^ 0xEDACA0BC) & 0x707E4CB1
           | (*(_DWORD *)&aYcsvllo3xM9zAa[4 * v4] + v17) & 0x8F81B34E ^ 0x2011342)
          ^ v18
          ^ 0x622D13F2)
         ^ (*(_DWORD *)&aYcsvllo3xM9zAa[4 * v4] + v17)
         & ~v18;
    *a3 += 2135587861;
    v15 = sub_140006120((unsigned int)*a1);
    v16 = *a3;
    v5 = v16 + *(_DWORD *)&aYcsvllo3xM9zAa[4 * (unsigned int)sub_140006160(*a3, i)];
    v6 = ~(~(v5 & 0x63E364E2 ^ ~v5 & 0x9C1C9B1D ^ 0xE5CC39DD)
         | ~(v5 & 0x63E364E2 ^ ~v5 & 0x9C1C9B1D ^ 0x63E364E2) & 0x862F5D3F);
    v7 = (v15 & 0x80275917 | ~(v15 & 0x862F5D3F) & 0x708A428) ^ 0xF8F75BD7;
    v8 = ~((v15 ^ 0x79D0A2C0) & ~v15 | 0x4B820ECE) & 0xEAD124A6;
    v9 = ~(v7 ^ (v15 ^ 0x79D0A2C0) & ~v15) | v7 & ~((v15 ^ 0x79D0A2C0) & ~v15);
    v10 = ~(~(v5 & 0x862F5D3F | v6) | v5 & 0x862F5D3F ^ 0xC6AB228 ^ v6 ^ 0xC6AB228) | v5 & 0x862F5D3F ^ v6;
    v11 = ~(v10 | v10 ^ 0xB3673F0F);
    v12 = v10 & 0xB3673F0F;
    v13 = ~((~(v9
             | ~((v15 & 0x2000C0C | ~(v15 & 0x2020C0E) & 0x898781E3)
               ^ (v7 & 0x34787010 | ~(v7 & 0xB47DF131) & 0x898781E3)
               ^ (~(~((v15 ^ 0x79D0A2C0) & ~v15 & 0x4B820ECE) | (v15 ^ 0x79D0A2C0) & ~v15 | 0x4B820ECE)
                | ((v15 ^ 0x79D0A2C0) & ~v15 & 0x4A800486 | ~((v15 ^ 0x79D0A2C0) & ~v15 & 0x4B820ECE) & 0x152EDB59)
                ^ (v8 | (v15 ^ 0x79D0A2C0) & ~v15 & 0x142CD111 | 0x1020A48))))
           | v9
           ^ 0x516953A5
           ^ (v15 & 0x2000C0C | ~(v15 & 0x2020C0E) & 0x898781E3)
           ^ (v7 & 0x34787010 | ~(v7 & 0xB47DF131) & 0x898781E3)
           ^ (~(~((v15 ^ 0x79D0A2C0) & ~v15 & 0x4B820ECE) | (v15 ^ 0x79D0A2C0) & ~v15 | 0x4B820ECE)
            | ((v15 ^ 0x79D0A2C0) & ~v15 & 0x4A800486 | ~((v15 ^ 0x79D0A2C0) & ~v15 & 0x4B820ECE) & 0x152EDB59)
            ^ (v8 | (v15 ^ 0x79D0A2C0) & ~v15 & 0x142CD111 | 0x1020A48))
           ^ 0xAE96AC5A)
          ^ 0xB3673F0F);
    v14 = ~(~v12 | ~v11) | v12 ^ 0xBC734574 ^ v11 ^ 0xBC734574;
    *a2 += ~v14 & v13 | ~v13 & v14;
`;

  const $ = (id) => document.getElementById(id);
  const input = $("input");
  const output = $("output");
  const inputGutter = $("inputGutter");
  const outputGutter = $("outputGutter");
  const inputMeta = $("inputMeta");
  const outputMeta = $("outputMeta");
  const btnSimplify = $("btnSimplify");
  const btnDeep = $("btnDeep");
  const btnCopy = $("btnCopy");
  const btnSample = $("btnSample");
  const btnClear = $("btnClear");
  const status = $("status");
  const statusText = status.querySelector(".txt");
  const toast = $("toast");
  const widthGroup = $("widthGroup");
  const workspace = $("workspace");

  let width = 32;
  let busy = false;
  let lastMode = "normal";
  let toastTimer = 0;

  function setStatus(text, kind) {
    status.classList.remove("busy", "error");
    if (kind) status.classList.add(kind);
    statusText.textContent = text;
  }

  function notify(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  function lineCount(text) {
    if (!text) return 1;
    let n = 1;
    for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) n++;
    return n;
  }

  function paintGutter(ta, gutter, meta) {
    const n = lineCount(ta.value);
    let s = "";
    for (let i = 1; i <= n; i++) s += i + (i < n ? "\n" : "");
    gutter.textContent = s;
    gutter.scrollTop = ta.scrollTop;
    meta.textContent = n + " 行";
  }

  function syncScroll(ta, gutter) {
    gutter.scrollTop = ta.scrollTop;
  }

  function setOutput(text) {
    output.value = text || "";
    output.scrollTop = 0;
    output.scrollLeft = 0;
    paintGutter(output, outputGutter, outputMeta);
    btnCopy.disabled = !output.value;
    btnDeep.disabled = !output.value || busy;
    updateStats({});
  }

  function setBusy(value) {
    busy = value;
    btnSimplify.disabled = value;
    btnDeep.disabled = value || !output.value;
    widthGroup.querySelectorAll("button").forEach((b) => { b.disabled = value; });
  }

  function pctReduction(inText, outText) {
    if (!inText) return "—";
    const r = (1 - outText.length / inText.length) * 100;
    if (!isFinite(r)) return "—";
    return (r >= 0 ? "−" : "+") + Math.abs(r).toFixed(r >= 10 || r <= -10 ? 0 : 1) + "%";
  }

  function updateStats(res) {
    if (res && typeof res.statements === "number") {
      $("statStmts").textContent = res.statements;
      $("statChanged").textContent = res.simplified;
      $("statPasses").textContent = res.passes;
      $("statTime").textContent = (res.durationMs ?? 0) + " ms";
      $("statReduction").textContent = pctReduction(input.value, output.value);
    }
    $("statWidth").textContent = width;
  }

  async function run(mode) {
    if (busy) return;
    const code = mode === "deep" ? output.value : input.value;
    if (!code || !code.trim()) {
      notify(mode === "deep" ? "右侧还没有结果" : "请先输入 C 代码或表达式");
      input.focus();
      return;
    }
    if (typeof window.simplifyCode !== "function") {
      setStatus("未连接到 Go 后端，请通过 AutoMBA 程序打开", "error");
      notify("WebView 绑定不可用");
      return;
    }

    setBusy(true);
    setStatus(mode === "deep" ? "正在传播定义并再次化简…" : "正在解析并化简 MBA…", "busy");
    const t0 = performance.now();
    try {
      const res = await window.simplifyCode(code, width, mode);
      if (!res) throw new Error("后端没有返回结果");
      if (res.error) {
        setOutput(res.output || "");
        setStatus("化简失败：" + res.error, "error");
        notify(res.error);
        return;
      }
      output.value = res.output || "";
      output.scrollTop = 0;
      output.scrollLeft = 0;
      paintGutter(output, outputGutter, outputMeta);
      btnCopy.disabled = !output.value;
      btnDeep.disabled = !output.value;
      lastMode = mode;
      updateStats(res);
      const ms = res.durationMs ?? Math.round(performance.now() - t0);
      const label = mode === "deep" ? "再简化完成" : "化简完成";
      setStatus(`${label} · ${res.statements} 条语句 · ${res.simplified} 条改写 · ${res.passes} 轮 · ${ms} ms`, null);
      if (res.warnings && res.warnings.length) {
        notify(res.warnings[0]);
      }
    } catch (err) {
      setStatus("调用化简器失败：" + (err && err.message ? err.message : err), "error");
      notify("化简调用失败");
    } finally {
      setBusy(false);
    }
  }

  async function copyResult() {
    const text = output.value;
    if (!text) { notify("结果为空"); return; }
    try {
      await navigator.clipboard.writeText(text);
      notify("结果已复制");
    } catch (_) {
      output.focus();
      output.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      notify(ok ? "结果已复制" : "复制失败，请手动选择复制");
    }
  }

  function setWidth(next) {
    if (busy) return;
    width = next;
    widthGroup.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("active", Number(b.dataset.width) === width);
    });
    $("statWidth").textContent = width;
    if (output.value && input.value.trim()) {
      run(lastMode === "deep" ? "deep" : "normal");
    } else {
      setStatus(`位宽已切换为 ${width}-bit`, null);
    }
  }

  // Events
  btnSimplify.addEventListener("click", () => run("normal"));
  btnDeep.addEventListener("click", () => run("deep"));
  btnCopy.addEventListener("click", copyResult);

  btnSample.addEventListener("click", () => {
    input.value = SAMPLE;
    input.setSelectionRange(0, 0);
    input.scrollTop = 0;
    paintGutter(input, inputGutter, inputMeta);
    setOutput("");
    input.focus({ preventScroll: true });
    input.scrollTop = 0;
    setStatus("示例已载入，正在化简…", "busy");
    setTimeout(() => run("normal"), 30);
  });

  btnClear.addEventListener("click", () => {
    input.value = "";
    setOutput("");
    paintGutter(input, inputGutter, inputMeta);
    input.focus();
    lastMode = "normal";
    setStatus("就绪 · 粘贴代码后按 Ctrl+Enter", null);
    updateStats({});
    $("statStmts").textContent = "0";
    $("statChanged").textContent = "0";
    $("statPasses").textContent = "0";
    $("statTime").textContent = "—";
    $("statReduction").textContent = "—";
  });

  widthGroup.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-width]");
    if (!b) return;
    setWidth(Number(b.dataset.width));
  });

  input.addEventListener("input", () => {
    paintGutter(input, inputGutter, inputMeta);
    updateStats({});
    if (!output.value) {
      $("statReduction").textContent = "—";
    }
  });
  input.addEventListener("scroll", () => syncScroll(input, inputGutter));
  output.addEventListener("scroll", () => syncScroll(output, outputGutter));

  input.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const v = input.value;
      input.value = v.slice(0, start) + "    " + v.slice(end);
      input.selectionStart = input.selectionEnd = start + 4;
      paintGutter(input, inputGutter, inputMeta);
      return;
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      run(e.shiftKey ? "deep" : "normal");
    }
  });

  // Draggable splitter.
  const splitter = $("splitter");
  let dragging = false;
  splitter.addEventListener("mousedown", (e) => {
    if (window.matchMedia("(max-width: 900px)").matches) return;
    dragging = true;
    document.body.style.cursor = "col-resize";
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const rect = workspace.getBoundingClientRect();
    let p = ((e.clientX - rect.left) / rect.width) * 100;
    p = Math.max(24, Math.min(76, p));
    document.documentElement.style.setProperty("--split", p.toFixed(2) + "%");
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = "";
  });

  // Initial state.
  paintGutter(input, inputGutter, inputMeta);
  paintGutter(output, outputGutter, outputMeta);
  updateStats({});
  setStatus("就绪 · 粘贴代码后按 Ctrl+Enter", null);
  setTimeout(() => input.focus(), 80);
})();
</script>
</body>
</html>
