<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoMBA · MBA Simplifier</title>
<style>
  :root {
    --bg: #080b11;
    --bg-soft: #0b1018;
    --panel: #0d131d;
    --panel-2: #101823;
    --border: #1b2737;
    --border-soft: #16202d;
    --text: #d8e3f0;
    --muted: #73849a;
    --faint: #405168;
    --accent: #54d6c5;
    --accent-2: #f0b35f;
    --red: #ff6f7d;
    --green: #54d68a;
    --blue: #64b5ff;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "JetBrains Mono", "Fira Code", monospace;
    --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --split: 50%;

    /* CLion / Darcula code colours */
    --code-fg: #a9b7c6;
    --code-keyword: #cc7832;
    --code-string: #6a8759;
    --code-number: #6897bb;
    --code-comment: #808080;
    --code-function: #ffc66d;
    --code-macro: #9876aa;
    --code-preproc: #bbb529;
    --code-op: #a9b7c6;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(84, 214, 197, .07), transparent 60%),
      radial-gradient(900px 420px at 95% 0%, rgba(100, 181, 255, .05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: rgba(84, 214, 197, .26); color: #fff; }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: 56px minmax(0, 1fr) 34px;
    min-width: 0;
  }

  /* ---------- action bar ---------- */
  .segmented {
    display: inline-flex;
    align-items: center;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--border);
    background: #0a1018;
    border-radius: 10px;
  }
  .segmented button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 11.5px/1 var(--mono);
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .segmented button:hover { color: var(--text); background: #141e2b; }
  .segmented button.active {
    color: #04110f;
    background: linear-gradient(135deg, #45c9ba, #74e0d0);
    box-shadow: 0 2px 10px rgba(84, 214, 197, .2);
  }
  /* ---------- action bar ---------- */
  .actionbar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 22px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(9, 14, 21, .55);
    user-select: none;
  }
  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 13px;
    border-radius: 8px;
    border: 1px solid #263445;
    background: #121a25;
    color: #c7d4e3;
    font: 500 12px/1 var(--ui);
    cursor: pointer;
    transition: transform .12s, border-color .15s, background .15s, color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #172231; border-color: #34465c; color: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .38; cursor: default; transform: none; }
  .btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .btn.primary {
    border-color: #42bcae;
    background: linear-gradient(135deg, #3cc4b4, #68ded0);
    color: #03110f;
    font-weight: 650;
    box-shadow: 0 3px 16px rgba(84, 214, 197, .16), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn.primary:hover { background: linear-gradient(135deg, #4bd4c3, #7ce8da); border-color: #5cd6c8; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: rgba(255,255,255,.04); border-color: var(--border); color: var(--text); }
  .btn kbd {
    margin-left: 2px;
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,.22);
    background: rgba(0,0,0,.13);
    font: 500 9px/1 var(--mono);
    color: rgba(3,17,15,.65);
  }
  .keep-refs {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 9px;
    border: 1px solid #263445;
    border-radius: 8px;
    background: #0a1119;
    transition: border-color .15s, box-shadow .15s;
  }
  .keep-refs:focus-within {
    border-color: rgba(84, 214, 197, .7);
    box-shadow: 0 0 0 2px rgba(84, 214, 197, .08);
  }
  .keep-refs span {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .keep-refs input {
    width: 118px;
    min-width: 0;
    padding: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--accent);
    font: 600 11.5px/1 var(--mono);
  }
  .keep-refs input::placeholder { color: #405168; font-weight: 400; }

  .settings-wrap { position: relative; display: inline-flex; }
  .icon-btn {
    width: 34px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    color: var(--muted);
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn[aria-expanded="true"] {
    color: var(--accent);
    border-color: rgba(84, 214, 197, .55);
    background: #12242a;
  }
  .settings-popover {
    position: absolute;
    z-index: 40;
    top: calc(100% + 9px);
    right: 0;
    width: 286px;
    padding: 13px 14px 14px;
    border: 1px solid #2a3a4e;
    border-radius: 11px;
    background: linear-gradient(180deg, #121b27, #0d141e);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255,255,255,.035);
  }
  .settings-popover[hidden] { display: none; }
  .settings-heading {
    margin-bottom: 12px;
    color: #dfe9f5;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }
  .settings-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .3px;
    white-space: nowrap;
  }
  .segmented.compact { padding: 2px; border-radius: 8px; }
  .segmented.compact button { padding: 5px 8px; font-size: 10.5px; }
  .lang-select {
    height: 30px;
    min-width: 126px;
    padding: 0 8px;
    border: 1px solid #263445;
    border-radius: 7px;
    outline: none;
    background: #0a1119;
    color: var(--text);
    font: 500 11px/1 var(--ui);
    cursor: pointer;
  }
  .lang-select:focus { border-color: rgba(84, 214, 197, .65); }
  .settings-check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 12px;
    color: #aebdd0;
    font-size: 11px;
    line-height: 1.4;
    cursor: pointer;
    user-select: none;
  }
  .settings-check input {
    width: 13px;
    height: 13px;
    margin: 1px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .settings-check span { flex: 1; }

  .head-tools {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: 6px;
  }
  .head-icon {
    appearance: none;
    position: relative;
    width: 24px;
    height: 22px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }
  .head-icon svg { width: 14px; height: 14px; }
  .head-icon:hover { color: var(--text); background: rgba(255,255,255,.05); border-color: var(--border); }
  .head-icon:disabled { opacity: .3; cursor: default; background: transparent; border-color: transparent; }
  .warn-badge {
    position: absolute;
    top: 0;
    right: -1px;
    min-width: 9px;
    height: 9px;
    padding: 0 2px;
    border-radius: 5px;
    background: var(--red);
    color: #1a0508;
    font: 700 7px/9px var(--mono);
    text-align: center;
  }
  .warn-badge[hidden] { display: none; }
  .warn-badge.info { background: var(--accent); color: #04110f; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    background: rgba(3, 6, 10, .66);
    backdrop-filter: blur(3px);
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    width: min(1040px, 92vw);
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    border: 1px solid #2b3b4e;
    border-radius: 12px;
    background: #0d141e;
    box-shadow: 0 28px 90px rgba(0,0,0,.65);
    overflow: hidden;
  }
  .modal.small { width: min(560px, 92vw); }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 42px;
    flex: 0 0 42px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border-soft);
    color: #c9d6e5;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .3px;
    user-select: none;
  }
  .modal-close {
    appearance: none;
    width: 24px; height: 24px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font: 400 18px/1 var(--ui);
    cursor: pointer;
  }
  .modal-close:hover { color: #fff; background: rgba(255,255,255,.06); border-color: var(--border); }
  .diff-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    min-height: 0;
    overflow: auto;
    background: var(--border-soft);
  }
  .diff-col-head {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 7px 14px;
    background: #111a26;
    color: var(--muted);
    font: 600 10px/1 var(--mono);
    letter-spacing: .7px;
    text-transform: uppercase;
  }
  .diff-col {
    min-width: 0;
    background: #0b1119;
  }
  .diff-lines { padding: 6px 0 12px; }
  .diff-line {
    display: flex;
    gap: 10px;
    min-height: 20px;
    padding: 0 12px 0 0;
    white-space: pre;
    font: 11.5px/1.62 var(--mono);
    color: #b9c6d6;
  }
  .diff-line .ln {
    flex: 0 0 38px;
    padding-right: 8px;
    color: #3c4d63;
    text-align: right;
    user-select: none;
  }
  .diff-line .code { min-width: 0; }
  .diff-line.add { background: rgba(70, 150, 95, .14); }
  .diff-line.add .code { color: #a8e6b8; }
  .diff-line.del { background: rgba(180, 70, 80, .13); }
  .diff-line.del .code { color: #f0b0b6; }
  .diff-line.empty { background: rgba(255,255,255,.015); }
  .warn-list { padding: 12px 16px 18px; overflow: auto; }
  .warn-item {
    display: flex;
    gap: 9px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-soft);
    color: #b9c6d6;
    font-size: 11.5px;
    line-height: 1.55;
  }
  .warn-item:last-child { border-bottom: 0; }
  .warn-item .dot { flex: 0 0 7px; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--accent-2); }
  .warn-item.fail .dot { background: var(--red); }
  .warn-item.pass .dot { background: var(--green); }
  .warn-item.info .dot { background: var(--blue); }
  .warn-item code { color: #f0d49a; }

  .spacer { flex: 1; }
  .hint {
    color: var(--faint);
    font-size: 10.5px;
    letter-spacing: .2px;
    margin-right: 3px;
  }

  /* ---------- workspace ---------- */
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, var(--split)) 8px minmax(0, 1fr);
    min-height: 0;
    padding: 12px 14px 10px;
    gap: 0;
  }
  .panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(15, 22, 33, .92), rgba(11, 16, 25, .94));
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025);
  }
  .input-panel { border-top-left-radius: 12px; }
  .output-panel { border-top-right-radius: 12px; }
  .panel-head {
    height: 38px;
    flex: 0 0 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 13px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(255,255,255,.012);
    user-select: none;
  }
  .panel-title {
    display: flex; align-items: center; gap: 8px;
    color: #aebdd0;
    font-size: 11.5px;
    font-weight: 550;
    letter-spacing: .2px;
  }
  .badge {
    font: 700 8.5px/1 var(--mono);
    letter-spacing: 1px;
    padding: 4px 5px;
    border-radius: 4px;
    border: 1px solid rgba(84, 214, 197, .22);
    background: rgba(84, 214, 197, .08);
    color: var(--accent);
  }
  .badge.out {
    border-color: rgba(240, 179, 95, .22);
    background: rgba(240, 179, 95, .08);
    color: var(--accent-2);
  }
  .panel-meta {
    color: var(--faint);
    font: 500 10px/1 var(--mono);
    letter-spacing: .4px;
  }
  .editor {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }
  .gutter {
    flex: 0 0 48px;
    padding: 15px 9px 15px 0;
    text-align: right;
    color: #3c4d63;
    font: 12.5px/1.62 var(--mono);
    white-space: pre;
    overflow: hidden;
    user-select: none;
    border-right: 1px solid rgba(27, 39, 55, .55);
    background: rgba(0,0,0,.08);
  }
  .code-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  .code-highlight {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 15px 18px;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    color: var(--code-fg);
    font: 12.5px/1.62 var(--mono);
    tab-size: 4;
    white-space: pre;
    scrollbar-width: none;
  }
  .code-highlight code {
    font: inherit;
    color: inherit;
    white-space: pre;
  }
  .code-highlight .tok-keyword { color: var(--code-keyword); }
  .code-highlight .tok-type { color: var(--code-fg); }
  .code-highlight .tok-string { color: var(--code-string); }
  .code-highlight .tok-number { color: var(--code-number); }
  .code-highlight .tok-comment { color: var(--code-comment); font-style: italic; }
  .code-highlight .tok-function { color: var(--code-function); }
  .code-highlight .tok-macro { color: var(--code-macro); }
  .code-highlight .tok-preproc { color: var(--code-preproc); }
  .code-highlight .tok-op { color: var(--code-op); }
  .code-highlight .tok-punct { color: #7f8c9b; }
  textarea {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 15px 18px;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: var(--accent);
    font: 12.5px/1.62 var(--mono);
    tab-size: 4;
    white-space: pre;
    overflow: auto;
    scrollbar-color: #2a3a4e transparent;
    scrollbar-width: thin;
  }
  textarea::placeholder {
    color: #3c4d63;
    -webkit-text-fill-color: #3c4d63;
    opacity: 1;
  }
  textarea::selection { background: rgba(33, 102, 160, .42); }
  #output::placeholder { color: #3c4d63; }
  textarea::-webkit-scrollbar { width: 11px; height: 11px; }
  textarea::-webkit-scrollbar-thumb {
    background: #263547;
    border: 3px solid transparent;
    background-clip: padding-box;
    border-radius: 8px;
  }
  textarea::-webkit-scrollbar-thumb:hover { background: #334961; background-clip: padding-box; border: 3px solid transparent; }
  textarea::-webkit-scrollbar-corner { background: transparent; }

  .splitter {
    cursor: col-resize;
    display: grid;
    place-items: center;
    user-select: none;
  }
  .splitter span {
    width: 2px;
    height: 46px;
    border-radius: 2px;
    background: #223044;
    transition: background .15s, box-shadow .15s;
  }
  .splitter:hover span { background: var(--accent); box-shadow: 0 0 8px rgba(84,214,197,.5); }

  /* ---------- footer ---------- */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 22px;
    border-top: 1px solid var(--border-soft);
    background: rgba(7, 11, 17, .76);
    color: var(--muted);
    font-size: 10.5px;
    user-select: none;
  }
  .status { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 7px rgba(84,214,138,.65);
    flex: 0 0 auto;
  }
  .status.busy .led { background: var(--accent-2); box-shadow: 0 0 9px rgba(240,179,95,.7); animation: pulse 1s ease-in-out infinite; }
  .status.error .led { background: var(--red); box-shadow: 0 0 9px rgba(255,111,125,.75); }
  .status .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; align-items: center; gap: 7px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 20px;
    padding: 0 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: rgba(255,255,255,.018);
    color: var(--faint);
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .2px;
    white-space: nowrap;
  }
  .chip b { color: #9fb1c5; font-weight: 600; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 52px;
    transform: translate(-50%, 8px);
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid #2b3b4e;
    background: #121b26;
    color: #dbe7f3;
    font-size: 11.5px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1180px) {
    .hint { display: none; }
    .actionbar { gap: 6px; }
  }
  @media (max-width: 980px) {
    .btn { padding: 0 10px; }
    .btn kbd { display: none; }
    .btn.ghost { padding: 0 8px; }
    .keep-refs span { display: none; }
    .keep-refs input { width: 92px; }
  }
  @media (max-width: 900px) {
    .app { grid-template-rows: 54px minmax(0, 1fr) 34px; }
    .workspace {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 8px minmax(0, 1fr);
      padding: 9px;
    }
    .splitter { cursor: row-resize; }
    .splitter span { width: 46px; height: 2px; }
    .hint { display: none; }
    .actionbar { padding-left: 12px; padding-right: 12px; }
    .footer { padding: 0 12px; }
    .stats .chip.optional { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="actionbar">
    <button class="btn primary" id="btnSimplify" title="Parse the input and simplify MBA">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l1-8Z"/></svg>
      <span data-i18n="simplify">Simplify</span> <kbd>Ctrl↵</kbd>
    </button>
    <button class="btn" id="btnDeep" disabled title="Use the current result, propagate known definitions and simplify again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span data-i18n="simplifyAgain">Simplify Again</span>
    </button>
    <button class="btn" id="btnCopy" disabled title="Copy the result">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span data-i18n="copy">Copy Result</span>
    </button>
    <label class="keep-refs" for="keepRefs" title="Keep only these root references; other local variables are inlined and merged. Format: a1;a2;a3">
      <span data-i18n="keepRefs">Keep refs</span>
      <input id="keepRefs" type="text" placeholder="a1;a2;a3" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">

      dragResize: "拖动调整比例",

      labelRefs: "引用合并完成",

      labelNormal: "化简完成",
      stmtCount: "{n} 条语句",
      mergedKeep: "保留 {refs} · 合并 {n}",
      rewritten: "{n} 条改写",
      bitWidthSet: "位宽已切换为 {n}-bit",
      noInput: "请先输入 C 代码或表达式",
      noOutput: "右侧还没有结果",
      backendMissing: "未连接到 Go 后端，请通过 AutoMBA 程序打开",
      backendUnavailable: "后端绑定不可用",
      simplifyFailed: "化简失败：",
      callFailed: "调用化简器失败：",
      copyOk: "结果已复制",
      copyEmpty: "结果为空",
      copyFail: "复制失败，请手动选择复制",
      settingsSaveFailed: "保存设置失败",
      controlFlowFallback: "检测到控制流，已退化为逐表达式化简（未做引用合并）",
      noKeepMatch: "没有与引用列表匹配的语句",
      tooLarge: "输入过大（上限 512 KB）",
      emptyInput: "请输入要简化的 C 表达式或代码",
      internalError: "化简器内部错误",
      parseFailed: "无法解析输入，已原样保留",
      noResult: "化简没有返回结果"
    }
  };

  function t(key, vars) {
    const dict = I18N[language] || I18N.en;
    let s = dict[key] || I18N.en[key] || key;
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? String(vars[k]) : ""));
    }
    return s;
  }

  function localizeBackend(msg) {
    if (!msg || language !== "en") return msg || "";
    let out = msg;
    out = out.replace("请输入要简化的 C 表达式或代码", I18N.en.emptyInput);
    out = out.replace("输入过大（上限 512 KB）", I18N.en.tooLarge);
    out = out.replace("检测到控制流，已退化为逐表达式化简（未做引用合并）", I18N.en.controlFlowFallback);
    out = out.replace("没有与引用列表匹配的语句", I18N.en.noKeepMatch);
    out = out.replace("无法解析输入，已原样保留", I18N.en.parseFailed);
    out = out.replace("化简没有返回结果", I18N.en.noResult);
    out = out.replace(/化简器内部错误[:：]?\s*/, I18N.en.internalError + ": ");
    out = out.replace(/无法解析表达式\s*(.+?)，已原样保留/g, "Could not parse expression $1; left unchanged");
    out = out.replace(/无法解析 return 表达式，已原样保留/g, "Could not parse return expression; left unchanged");
    out = out.replace(/表达式展开过大，已停止继续内联部分变量/g, "Expression expansion too large; stopped inlining some variables");
    return out;
  }

  function applyLanguage() {
    const dict = I18N[language] || I18N.en;
    document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.dataset.i18n;
      if (dict[key]) el.textContent = dict[key];
    });
    input.placeholder = t("placeholderInput");
    output.placeholder = t("placeholderOutput");
    input.setAttribute("aria-label", dict.inputTitle);
    output.setAttribute("aria-label", dict.outputTitle);
    btnSimplify.title = t("simplifyTitle");
    btnDeep.title = t("simplifyAgainTitle");
    btnCopy.title = t("copyTitle");
    btnSettings.title = t("settingsTitle");
    btnSettings.setAttribute("aria-label", t("settingsTitle"));
    btnDiff.title = t("diffView");
    btnDiff.setAttribute("aria-label", t("diffView"));
    btnWarnings.title = t("warnings");
    btnWarnings.setAttribute("aria-label", t("warnings"));
    keepRefsInput.parentElement.title = t("refsTitle");
    splitterEl.title = t("dragResize");
    languageSelect.value = language;
    document.title = language === "zh" ? "AutoMBA · MBA 化简器" : "AutoMBA · MBA Simplifier";
    paintGutter(input, inputGutter, inputMeta);
    paintGutter(output, outputGutter, outputMeta);
  }

  function syncWidthUI() {
    widthGroup.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("active", Number(b.dataset.width) === width);
    });
    $("statWidth").textContent = width;
  }

  function persistSettings() {
    if (typeof window.saveConfig !== "function") return;
    window.saveConfig(width, language, verifyOption, preserveOption).catch(() => notify(t("settingsSaveFailed")));
  }

  function openSettings(open) {
    settingsPanel.hidden = !open;
    btnSettings.setAttribute("aria-expanded", String(open));
  }

  function setStatus(text, kind) {
    status.classList.remove("busy", "error");
    if (kind) status.classList.add(kind);
    statusText.textContent = text;
  }

  function notify(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  function verifyShort(v) {
    if (!v) return "";
    if (v.status === "passed") return t("verifyPassed");
    if (v.status === "failed") return t("verifyFailed");
    return t("verifySkipped");
  }

  function updateWarningState() {
    const count = lastWarnings.length + (lastVerification ? 1 : 0);
    warnBadge.hidden = count === 0;
    warnBadge.textContent = count ? String(count) : "";
    const passedOnly = lastVerification && lastVerification.status === "passed" && lastWarnings.length === 0;
    warnBadge.classList.toggle("info", !!passedOnly);
  }

  function renderWarnings() {
    warnList.innerHTML = "";
    const add = (cls, text) => {
      const row = document.createElement("div");
      row.className = "warn-item " + cls;
      row.innerHTML = '<span class="dot"></span><span>' + escapeHTML(text) + "</span>";
      warnList.appendChild(row);
    };
    if (lastVerification) {
      const v = lastVerification;
      if (v.status === "passed") {
        add("pass", t("verification") + ": " + t("verified", { n: v.cases }));
      } else if (v.status === "failed") {
        add("fail", t("verification") + ": " + (v.message || t("verifyFailed")));
      } else {
        add("info", t("verification") + ": " + (v.message || t("verifySkipped")));
      }
    }
    for (const w of lastWarnings) add("info", localizeBackend(w));
    if (!lastVerification && lastWarnings.length === 0) {
      const empty = document.createElement("div");
      empty.className = "warn-item info";
      empty.textContent = t("noWarnings");
      warnList.appendChild(empty);
    }
  }

  function lineRows(text) {
    if (text === "") return [""];
    const lines = text.split("\n");
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
    return lines;
  }

  function diffRows(oldText, newText) {
    const a = lineRows(oldText);
    const b = lineRows(newText);
    if (a.length > 1400 || b.length > 1400) {
      return [
        ...a.map((x) => ({ type: "del", old: x, nu: "" })),
        ...b.map((x) => ({ type: "add", old: "", nu: x })),
      ];
    }
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push({ type: "eq", old: a[i], nu: b[j] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: "del", old: a[i], nu: "" }); i++; }
      else { ops.push({ type: "add", old: "", nu: b[j] }); j++; }
    }
    while (i < n) { ops.push({ type: "del", old: a[i], nu: "" }); i++; }
    while (j < m) { ops.push({ type: "add", old: "", nu: b[j] }); j++; }
    return ops;
  }

  function renderDiff() {
    const ops = diffRows(input.value, output.value);
    let oldNo = 1, newNo = 1;
    const left = [], right = [];
    const row = (cls, no, text) => {
      const num = text === "" && cls === "empty" ? "" : String(no);
      return `<div class="diff-line ${cls}"><span class="ln">${num}</span><span class="code">${escapeHTML(text)}</span></div>`;
    };
    for (const op of ops) {
      if (op.type === "eq") {
        left.push(row("eq", oldNo++, op.old));
        right.push(row("eq", newNo++, op.nu));
      } else if (op.type === "del") {
        left.push(row("del", oldNo++, op.old));
        right.push(row("empty", "", ""));
      } else {
        left.push(row("empty", "", ""));
        right.push(row("add", newNo++, op.nu));
      }
    }
    diffOld.innerHTML = left.join("");
    diffNew.innerHTML = right.join("");
  }

  function openModal(modal) {
    modal.hidden = false;
  }

  function closeModal(modal) {
    modal.hidden = true;
  }

  function lineCount(text) {
    if (!text) return 1;
    let n = 1;
    for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) n++;
    return n;
  }

  function paintGutter(ta, gutter, meta) {
    const n = lineCount(ta.value);
    let s = "";
    for (let i = 1; i <= n; i++) s += i + (i < n ? "\n" : "");
    gutter.textContent = s;
    gutter.scrollTop = ta.scrollTop;
    meta.textContent = t("lines", { n });
  }

  // CLion / Darcula-inspired C token highlighting.
  const C_KEYWORDS = new Set((
    "auto break case char const continue default do double else enum extern float for goto if inline " +
    "int long register restrict return short signed sizeof static struct switch typedef union unsigned " +
    "void volatile while _Bool bool true false NULL nullptr"
  ).split(/\s+/));
  const C_TYPES = new Set((
    "_DWORD _QWORD _BYTE _WORD _OWORD DWORD QWORD BYTE WORD OWORD ULONG LONG UINT INT BOOL PVOID HANDLE " +
    "LPVOID LPSTR LPCSTR uint8_t uint16_t uint32_t uint64_t int8_t int16_t int32_t int64_t size_t ssize_t " +
    "uintptr_t intptr_t wchar_t __int8 __int16 __int32 __int64 __int128"
  ).split(/\s+/));
  const C_OPS = [
    "<<=", ">>=", "...", "->", "++", "--", "&&", "||", "==", "!=", "<=", ">=",
    "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "<<", ">>", "::",
    "+", "-", "*", "/", "%", "&", "|", "^", "~", "!", "<", ">", "=", "?", ":",
    "(", ")", "[", "]", "{", "}", ";", ",", "."
  ];
  const C_PUNCT = new Set(["(", ")", "[", "]", "{", "}", ";", ",", "."]);
  const C_OPS_BY_FIRST = {};
  for (const op of C_OPS) (C_OPS_BY_FIRST[op[0]] ||= []).push(op);

  function escapeHTML(s) {
    return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function atLineStart(src, i) {
    let j = i - 1;
    while (j >= 0 && (src[j] === " " || src[j] === "\t")) j--;
    return j < 0 || src[j] === "\n";
  }

  function highlightC(src) {
    const out = [];
    const n = src.length;
    let i = 0;
    const token = (cls, text) => out.push(`<span class="${cls}">${escapeHTML(text)}</span>`);

    while (i < n) {
      const c = src[i];

      if (c === "/" && src[i + 1] === "/") {
        let j = src.indexOf("\n", i);
        if (j < 0) j = n;
        token("tok-comment", src.slice(i, j));
        i = j;
        continue;
      }
      if (c === "/" && src[i + 1] === "*") {
        let j = src.indexOf("*/", i + 2);
        j = j < 0 ? n : j + 2;
        token("tok-comment", src.slice(i, j));
        i = j;
        continue;
      }
      if (c === '"' || c === "'") {
        let j = i + 1;
        while (j < n) {
          if (src[j] === "\\") { j += 2; continue; }
          if (src[j] === c) { j++; break; }
          j++;
        }
        token("tok-string", src.slice(i, j));
        i = j;
        continue;
      }
      if (c === "#" && atLineStart(src, i)) {
        let j = i;
        while (j < n) {
          if (src[j] === "\\" && src[j + 1] === "\n") { j += 2; continue; }
          if (src[j] === "\n") break;
          j++;
        }
        token("tok-preproc", src.slice(i, j));
        i = j;
        continue;
      }
      if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
        const m = src.slice(i).match(/^(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)(?:[uUlL]+|[iI]64|UI64)?/);
        if (m) {
          token("tok-number", m[0]);
          i += m[0].length;
          continue;
        }
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i + 1;
        while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
        const word = src.slice(i, j);
        let k = j;
        while (k < n && (src[k] === " " || src[k] === "\t")) k++;
        if (C_KEYWORDS.has(word)) token("tok-keyword", word);
        else if (C_TYPES.has(word)) token("tok-type", word);
        else if (src[k] === "(") token("tok-function", word);
        else if (/^[A-Z_][A-Z0-9_]*$/.test(word)) token("tok-macro", word);
        else out.push(escapeHTML(word));
        i = j;
        continue;
      }

      let op = null;
      for (const cand of (C_OPS_BY_FIRST[c] || [])) {
        if (src.startsWith(cand, i)) { op = cand; break; }
      }
      if (op) {
        token(C_PUNCT.has(op) ? "tok-punct" : "tok-op", op);
        i += op.length;
        continue;
      }
      out.push(escapeHTML(c));
      i++;
    }
    return out.join("");
  }

  function renderHighlight(ta, codeEl) {
    codeEl.innerHTML = highlightC(ta.value) + (ta.value.endsWith("\n") ? "" : "\n");
    const pre = codeEl.parentElement;
    pre.scrollTop = ta.scrollTop;
    pre.scrollLeft = ta.scrollLeft;
  }

  let highlightRaf = 0;
  function scheduleHighlight(ta, codeEl) {
    cancelAnimationFrame(highlightRaf);
    highlightRaf = requestAnimationFrame(() => renderHighlight(ta, codeEl));
  }

  function syncScroll(ta, gutter, codeEl) {
    gutter.scrollTop = ta.scrollTop;
    const pre = codeEl.parentElement;
    pre.scrollTop = ta.scrollTop;
    pre.scrollLeft = ta.scrollLeft;
  }

  function setOutput(text) {
    output.value = text || "";
    output.scrollTop = 0;
    output.scrollLeft = 0;
    renderHighlight(output, outputCode);
    paintGutter(output, outputGutter, outputMeta);
    btnCopy.disabled = !output.value;
    btnDeep.disabled = !output.value || busy;
    btnDiff.disabled = !output.value;
    updateStats({});
  }

  function setBusy(value) {
    busy = value;
    btnSimplify.disabled = value;
    btnDeep.disabled = value || !output.value;
    widthGroup.querySelectorAll("button").forEach((b) => { b.disabled = value; });
  }

  function pctReduction(inText, outText) {
    if (!inText) return "—";
    const r = (1 - outText.length / inText.length) * 100;
    if (!isFinite(r)) return "—";
    return (r >= 0 ? "−" : "+") + Math.abs(r).toFixed(r >= 10 || r <= -10 ? 0 : 1) + "%";
  }

  function updateStats(res) {
    if (res && typeof res.statements === "number") {
      $("statStmts").textContent = res.statements;
      $("statChanged").textContent = res.simplified;
      $("statMerged").textContent = res.merged || 0;
      $("statTime").textContent = (res.durationMs ?? 0) + " ms";
      $("statReduction").textContent = pctReduction(input.value, output.value);
    }
    $("statWidth").textContent = width;
  }

  async function run(mode) {
    if (busy) return;
    const code = mode === "deep" ? output.value : input.value;
    const keep = keepRefsInput.value.trim();
    const apiMode = keep ? "refs" : mode;
    if (!code || !code.trim()) {
      notify(mode === "deep" ? t("noOutput") : t("noInput"));
      input.focus();
      return;
    }
    if (typeof window.simplifyCode !== "function") {
      setStatus(t("backendMissing"), "error");
      notify(t("backendUnavailable"));
      return;
    }

    setBusy(true);
    setStatus(apiMode === "refs"
      ? t("statusRefs", { refs: keep })
      : (mode === "deep" ? t("statusDeep") : t("statusNormal")), "busy");
    const t0 = performance.now();
    try {
      const res = await window.simplifyCode(code, width, apiMode, keep, verifyOption, preserveOption);
      if (!res) throw new Error(t("noResult"));
      if (res.error) {
        const msg = localizeBackend(res.error);
        setOutput(res.output || "");
        lastWarnings = (res.warnings || []).slice();
        lastVerification = res.verification || null;
        updateWarningState();
        setStatus(t("simplifyFailed") + msg, "error");
        notify(msg);
        return;
      }
      output.value = res.output || "";
      output.scrollTop = 0;
      output.scrollLeft = 0;
      renderHighlight(output, outputCode);
      paintGutter(output, outputGutter, outputMeta);
      btnCopy.disabled = !output.value;
      btnDeep.disabled = !output.value;
      btnDiff.disabled = !output.value;
      lastMode = apiMode;
      lastWarnings = (res.warnings || []).slice();
      lastVerification = res.verification || null;
      updateWarningState();
      updateStats(res);
      const ms = res.durationMs ?? Math.round(performance.now() - t0);
      const label = apiMode === "refs" ? t("labelRefs") : (mode === "deep" ? t("labelDeep") : t("labelNormal"));
      const extra = apiMode === "refs"
        ? ` · ${t("mergedKeep", { refs: keep, n: res.merged || 0 })}`
        : ` · ${t("rewritten", { n: res.simplified })}`;
      let verifyText = "";
      if (lastVerification) {
        verifyText = ` · ${t("verification")}: ${verifyShort(lastVerification)}`;
      }
      setStatus(`${label} · ${t("stmtCount", { n: res.statements })}${extra}${verifyText} · ${ms} ms`, null);
      if (lastVerification && lastVerification.status === "failed") {
        notify(lastVerification.message || t("verifyFailed"));
      } else if (lastWarnings.length) {
        notify(localizeBackend(lastWarnings[0]));
      }
    } catch (err) {
      setStatus(t("callFailed") + (err && err.message ? err.message : err), "error");
      notify(t("callFailed"));
    } finally {
      setBusy(false);
    }
  }

  async function copyResult() {
    const text = output.value;
    if (!text) { notify(t("copyEmpty")); return; }
    try {
      await navigator.clipboard.writeText(text);
      notify(t("copyOk"));
    } catch (_) {
      output.focus();
      output.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      notify(ok ? t("copyOk") : t("copyFail"));
    }
  }

  function setWidth(next) {
    if (busy) return;
    width = next;
    syncWidthUI();
    persistSettings();
    if (output.value && input.value.trim()) {
      run(lastMode === "deep" ? "deep" : "normal");
    } else {
      setStatus(t("bitWidthSet", { n: width }), null);
    }
  }

  async function loadSettings() {
    if (typeof window.loadConfig === "function") {
      try {
        const cfg = await window.loadConfig();
        if (cfg) {
          const w = Number(cfg.width);
          if ([8, 16, 32, 64].includes(w)) width = w;
          if (cfg.language === "en" || cfg.language === "zh") language = cfg.language;
          verifyOption = !!cfg.verify;
          preserveOption = !!cfg.preserveSideEffects;
        }
      } catch (_) {}
    }
    optVerify.checked = verifyOption;
    optPreserve.checked = preserveOption;
    syncWidthUI();
    applyLanguage();
    setStatus(t("ready"), null);
  }

  // Events
  btnSimplify.addEventListener("click", () => run("normal"));
  btnDeep.addEventListener("click", () => run("deep"));
  btnCopy.addEventListener("click", copyResult);
  btnDiff.addEventListener("click", () => {
    if (!output.value) return;
    renderDiff();
    openModal(diffModal);
  });
  btnWarnings.addEventListener("click", () => {
    renderWarnings();
    openModal(warningsModal);
  });
  $("btnDiffClose").addEventListener("click", () => closeModal(diffModal));
  $("btnWarningsClose").addEventListener("click", () => closeModal(warningsModal));
  diffModal.addEventListener("click", (e) => { if (e.target === diffModal) closeModal(diffModal); });
  warningsModal.addEventListener("click", (e) => { if (e.target === warningsModal) closeModal(warningsModal); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeModal(diffModal);
      closeModal(warningsModal);
    }
  });

  btnSettings.addEventListener("click", (e) => {
    e.stopPropagation();
    openSettings(settingsPanel.hidden);
  });
  document.addEventListener("click", (e) => {
    if (!settingsWrap.contains(e.target)) openSettings(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") openSettings(false);
  });
  languageSelect.addEventListener("change", () => {
    language = languageSelect.value === "zh" ? "zh" : "en";
    applyLanguage();
    persistSettings();
    setStatus(t("ready"), null);
  });
  optVerify.addEventListener("change", () => {
    verifyOption = optVerify.checked;
    persistSettings();
  });
  optPreserve.addEventListener("change", () => {
    preserveOption = optPreserve.checked;
    persistSettings();
  });

  btnClear.addEventListener("click", () => {
    input.value = "";
    setOutput("");
    renderHighlight(input, inputCode);
    paintGutter(input, inputGutter, inputMeta);
    input.focus();
    lastMode = "normal";
    lastWarnings = [];
    lastVerification = null;
    updateWarningState();
    setStatus(t("ready"), null);
    updateStats({});
    $("statStmts").textContent = "0";
    $("statChanged").textContent = "0";
    $("statMerged").textContent = "0";
    $("statTime").textContent = "—";
    $("statReduction").textContent = "—";
  });

  widthGroup.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-width]");
    if (!b) return;
    setWidth(Number(b.dataset.width));
  });

  input.addEventListener("input", () => {
    paintGutter(input, inputGutter, inputMeta);
    scheduleHighlight(input, inputCode);
    updateStats({});
    if (!output.value) {
      $("statReduction").textContent = "—";
    }
  });
  input.addEventListener("scroll", () => syncScroll(input, inputGutter, inputCode));
  output.addEventListener("scroll", () => syncScroll(output, outputGutter, outputCode));

  keepRefsInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      run("normal");
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const v = input.value;
      input.value = v.slice(0, start) + "    " + v.slice(end);
      input.selectionStart = input.selectionEnd = start + 4;
      paintGutter(input, inputGutter, inputMeta);
      scheduleHighlight(input, inputCode);
      return;
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      run(e.shiftKey ? "deep" : "normal");
    }
  });

  // Draggable splitter.
  const splitter = $("splitter");
  let dragging = false;
  splitter.addEventListener("mousedown", (e) => {
    if (window.matchMedia("(max-width: 900px)").matches) return;
    dragging = true;
    document.body.style.cursor = "col-resize";
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const rect = workspace.getBoundingClientRect();
    let p = ((e.clientX - rect.left) / rect.width) * 100;
    p = Math.max(24, Math.min(76, p));
    document.documentElement.style.setProperty("--split", p.toFixed(2) + "%");
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = "";
  });

  // Initial state (English is the default; config is loaded asynchronously).
  renderHighlight(input, inputCode);
  renderHighlight(output, outputCode);
  paintGutter(input, inputGutter, inputMeta);
  paintGutter(output, outputGutter, outputMeta);
  updateStats({});
  updateWarningState();
  setStatus(t("ready"), null);
  loadSettings();
  setTimeout(() => input.focus(), 80);
})();
</script>
</body>
</html>
